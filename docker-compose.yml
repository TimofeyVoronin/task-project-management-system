services:
  postgres:
    image: postgres:16
    container_name: task_pm_postgres
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    networks:
      - djangonetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-task_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  redis:
    image: redis:7-alpine
    container_name: task_pm_redis
    restart: unless-stopped
    ports: 
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - djangonetwork
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: task_pm_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - djangonetwork

  auth_service:
    image: python:3.12-slim
    container_name: task_pm_auth_service
    working_dir: /app
    command: sh -c "echo auth_service placeholder && sleep infinity"
    volumes:
      - ./services/auth_service:/app
    env_file:
      - ./.env
    depends_on:
      - postgres
    networks:
      - djangonetwork
  
  core_service:
    image: python:3.12-slim
    container_name: task_pm_core_service
    working_dir: /app
    command: sh -c "echo core_service placeholder && sleep infinity"
    volumes:
      - ./services/core_service:/app
    env_file:
      - ./.env
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - djangonetwork

  notification_service:
    image: python:3.12-slim
    container_name: task_pm_notification_service
    working_dir: /app
    command: sh -c "echo notification_service placeholder && sleep infinity"
    volumes:
      - ./services/notification_service:/app
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - djangonetwork


networks:
  djangonetwork:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  rabbitmq_data: