services:
  postgres:
    image: postgres:16
    container_name: task_pm_postgres
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    networks:
      - djangonetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-task_management}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: task_pm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - djangonetwork
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: task_pm_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - djangonetwork

  auth_service:
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    container_name: task_pm_auth_service
    restart: unless-stopped
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./services/auth_service/app:/app
      - ./.env:/workspace/.env:ro
    env_file:
      - ./.env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - djangonetwork

  core_service:
    build:
      context: ./services/core_service
      dockerfile: Dockerfile
    container_name: task_pm_core_service
    restart: unless-stopped
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./services/core_service/app:/app
      - ./.env:/workspace/.env:ro
    env_file:
      - ./.env
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - djangonetwork

  notification_service:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    container_name: task_pm_notification_service
    restart: unless-stopped
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./services/notification_service/app:/app
      - ./.env:/workspace/.env:ro
    env_file:
      - ./.env
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - djangonetwork

networks:
  djangonetwork:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  rabbitmq_data: